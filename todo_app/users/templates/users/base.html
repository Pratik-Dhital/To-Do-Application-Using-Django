<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>To-Do App</title>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Todo App</span>

        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-3">

            <span class="text-white">
                Welcome, {{ user.username }}
            </span>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-outline-light btn-sm">
                    Logout
                </button>
            </form>
            {% endif %}
    </nav>
    <div class="container mt-5">
        <h2 class="text-center alert alert-danger">To-Do Application</h2>
        {% block content %}
        {% endblock content %}
    </div>
    <script src="{% static 'users/js/jquery.js' %}"></script>
    <script src="{% static 'users/js/proper.js' %}"></script>
    <script src="{% static 'users/js/bootstrap.js' %}"></script>

</body>

</html>
