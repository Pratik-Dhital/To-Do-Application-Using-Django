{% extends "users/base.html" %}

{% block start %}

<div class="container mt-5">

    <div class="col-md-4 offset-md-4">

        <h3 class="alert alert-info text-center">
            Login

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <input type="submit"
                   value="Login"
                   class="btn btn-success">

        </form>

    </div>

</div>

{% endblock %}
